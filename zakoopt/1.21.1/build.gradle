plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	modCompileOnly "maven.modrinth:sodium:${sodium_version}"
	modCompileOnly "maven.modrinth:immediatelyfast:${immediatelyfast_version}"
	modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
	modLocalRuntime "maven.modrinth:immediatelyfast:${immediatelyfast_version}"
	modCompileOnly "maven.modrinth:iris:${iris_version}"
	modCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
	modLocalRuntime "maven.modrinth:modmenu:${modmenu_version}"
}

// the jar also runs on NeoForge 21.1: its API only to compile NeoPlatform, NeoMod and the NeoForge-only mixins against
repositories {
	maven { url = 'https://maven.neoforged.net/releases' }
}
dependencies {
	compileOnly("net.neoforged:neoforge:${neoforge_version}:universal") { transitive = false }
}
