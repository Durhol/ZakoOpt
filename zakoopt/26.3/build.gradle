plugins {
	id 'net.fabricmc.fabric-loom'
}

repositories {
	maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "maven.modrinth:sodium:${sodium_version}"
	implementation "maven.modrinth:immediatelyfast:${immediatelyfast_version}"
	compileOnly "maven.modrinth:iris:${iris_version}"
	compileOnly "maven.modrinth:modmenu:${modmenu_version}"
	localRuntime "maven.modrinth:modmenu:${modmenu_version}"
	// NeoForge runs the same jar: its API only to compile NeoPlatform and NeoMod against
	compileOnly("net.neoforged:neoforge:${neoforge_version}:universal") { transitive = false }
	compileOnly("net.neoforged.fancymodloader:loader:${fml_version}") { transitive = false }
	compileOnly("net.neoforged:mergetool:2.0.7:api") { transitive = false }
	compileOnly "org.apache.maven:maven-artifact:3.10.0"
}

